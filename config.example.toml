# DistributionCenter — Solar Network distribution service.
serviceName = "distribution"
version = "dev"

[http]
port = "8080"
# Public origin used in artifact download_url values; do not include /api.
baseUrl = ""

[grpc]
port = "9090"
# Set true only when the fleet-issued certificate and key are mounted.
useTLS = false
certFile = "Keys/server.crt"
keyFile = "Keys/server.key"

[discovery]
# Blade registration is opt-in for local development.
enabled = false
target = "blade:9090"
registrationToken = ""
service = "distribution"
instanceId = ""
# Empty endpoints default to http://distribution:8080 and distribution:9090.
httpEndpoint = ""
grpcEndpoint = ""
leaseSeconds = 30
weight = 1


[database]
# PostgreSQL DSN is required at startup.
dsn = ""

[auth]
# Stargate owns access-token authentication.
target = "stargate:9090"
useTLS = false
tlsSkipVerify = false

[sphere]
# Sphere owns publisher identity and membership authorization.
target = "sphere:9090"
useTLS = false
tlsSkipVerify = false


[s3]
# Dedicated S3-compatible artifact pool. Objects remain private; published
# artifact responses contain time-limited signed GET URLs.
endpoint = "https://account-id.r2.cloudflarestorage.com"
accessKey = ""
# Secret Access Key paired with accessKey.
secretKey = ""
# Cloudflare R2 uses "auto"; AWS S3 uses the bucket's actual region.
region = "auto"
bucket = ""

[releases]
# Keep this many newest published releases' S3 artifacts per product.
# Set to 0 to disable cleanup. Expired artifacts remain in release metadata
# and are reported as expired by the release API.
artifactRetention = 3

[eventbus]
# Empty disables optional release events.
url = ""

[analytics]
# Collects pseudonymous update-check telemetry for DAU/MAU and target
# breakdowns. Keep the salt stable across deployments.
enabled = true
salt = ""