# DistributionCenter — Solar Network distribution service.
serviceName = "distribution"
version = "dev"

[http]
port = "8080"

[grpc]
port = "9090"
# Set true only when the fleet-issued certificate and key are mounted.
useTLS = false
certFile = "Keys/server.crt"
keyFile = "Keys/server.key"

[discovery]
# Blade registration is opt-in for local development.
enabled = false
target = "blade:9090"
registrationToken = ""
service = "distribution"
instanceId = ""
# Empty endpoints default to http://distribution:8080 and distribution:9090.
httpEndpoint = ""
grpcEndpoint = ""
leaseSeconds = 30
weight = 1


[database]
# PostgreSQL DSN is required at startup.
dsn = ""

[sphere]
# Sphere owns publisher identity and membership authorization.
target = ""
useTLS = false
tlsSkipVerify = false

[develop]
# Deprecated: publisher authorization no longer uses Develop.
target = ""
useTLS = false
tlsSkipVerify = false


[s3]
# Dedicated S3-compatible artifact pool. Configure its bucket policy to allow
# s3:GetObject only when the object tag public=true.
endpoint = ""
accessKey = ""
secretKey = ""
bucket = ""
region = ""
publicURL = ""

[eventbus]
# Empty disables optional release events.
url = ""

[analytics]
# Collects pseudonymous update-check telemetry for DAU/MAU and target
# breakdowns. Keep the salt stable across deployments.
enabled = true
salt = ""